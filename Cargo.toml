[package]
name = "thet"
version = "21.0.0"
edition = "2021"
description = "THET v21 - an experimental symmetric cipher (NOT for production)"
license = "MIT"
readme = "README.md"

[dependencies]
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
scrypt = { version = "0.11", default-features = false }
rand = "0.8"
libc = "0.2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "thet21"
path = "src/main.rs"
